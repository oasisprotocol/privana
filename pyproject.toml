[project]
name = "accounting-module"
version = "1.0.0"
description = "Accounting service module for ROFL apps"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "web3>=7.0.0",
    "httpx>=0.25.0",
    "eth-account>=0.13.0",
    "trie>=3.0.0",
    "rlp>=4.0.0",
    "cbor2>=5.0.0",
    "oasis-rofl-client>=0.2.0",
    "oasis-sapphire-py>=0.4.0",
    "cachetools>=5.0.0",
    "siwe>=4.3.0",
    "PyJWT>=2.8.0",
    "cryptography>=41.0.0",
    "diskcache>=5.6.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.15.17",
    "mypy>=1.0.0",
    "pre-commit>=4.0.0",
]
test = [
    "eth-utils>=5.0.0",
    "py-trie>=1.0.0",
]

[project.scripts]
accounting-module = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
mypy_path = "."
explicit_package_bases = true
# Relax strictness for now - incrementally enable as errors are fixed
warn_return_any = false
check_untyped_defs = false
disable_error_code = ["assignment", "arg-type", "call-overload", "union-attr", "attr-defined"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
    "ruff>=0.15.17",
    "pre-commit>=4.0.0",
    "types-cachetools>=5.0.0",
]
