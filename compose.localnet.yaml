services:
  privana:
    build:
      context: .
      args:
        - ENV_FILE=.env.localnet
    image: "privana:localnet"
    platform: linux/amd64
    environment:
      - ALCHEMY_API_KEY=${ALCHEMY_API_KEY}
      - SWEEP_STATE_DIR=/data/sweep-engine
      - ONRAMP_PROVIDER
      - MOONPAY_API_KEY=${MOONPAY_API_KEY}
      - MOONPAY_SECRET_KEY=${MOONPAY_SECRET_KEY}
      - ONRAMP_INTENT_SIGNING_KEY_ID
      - ONRAMP_INTENT_PREVIOUS_SIGNING_KEY_IDS
      - MOONPAY_API_BASE_URL=${MOONPAY_API_BASE_URL:-https://api.moonpay.com}
      - MOONPAY_WEBHOOK_SECRET_KEY=${MOONPAY_WEBHOOK_SECRET_KEY}
      - TRANSAK_API_KEY=${TRANSAK_API_KEY}
      - TRANSAK_API_SECRET=${TRANSAK_API_SECRET}
      - TRANSAK_API_BASE_URL
      - TRANSAK_GATEWAY_BASE_URL
      - TRANSAK_REFERRER_DOMAIN
      - TRANSAK_CLIENT_IP_HEADER
      - TRANSAK_CRYPTO_CURRENCY_CODE
      - TRANSAK_NETWORK
      - TRANSAK_CHAIN_ID
      - TRANSAK_TOKEN_ADDRESS
    volumes:
      - ./rofl-appd.sock:/run/rofl-appd.sock
      - sweep-engine-data:/data/sweep-engine
    network_mode: host # For sapphire-localnet
    ports:
      - "8000:8000"
    restart: on-failure

volumes:
  sweep-engine-data:
