services:
  privana:
    build:
      context: .
      args:
        - ENV_FILE=.env.testnet
    image: "ghcr.io/oasisprotocol/privana@sha256:b54e9c66a9fe115580119e4e219acbefffeca8ef1b7655a21e511ff2a0038f70"
    platform: linux/amd64
    environment:
      - SWEEP_STATE_DIR=/data/sweep-engine
      - ACCOUNTING_STATE_DIR=/data/accounting
      - SAPPHIRE_RPC_HEADERS
      - ONRAMP_PROVIDER
      - TRANSAK_CLIENT_IP_HEADER
      - TRANSAK_IP_ATTESTATION_SECRET
      - ALCHEMY_API_KEY
      - MOONPAY_API_KEY
      - MOONPAY_SECRET_KEY
      - MOONPAY_WEBHOOK_SECRET_KEY
      - TRANSAK_API_KEY
      - TRANSAK_API_SECRET
    volumes:
      - /run/rofl-appd.sock:/run/rofl-appd.sock
      - sweep-engine-data:/data/sweep-engine
      - accounting-data:/data/accounting
    ports:
      - "8000:8000"
    annotations:
      net.oasis.proxy.ports.8000.custom_domain: api.testnet.privana.finance
    restart: on-failure

volumes:
  sweep-engine-data:
  accounting-data:
