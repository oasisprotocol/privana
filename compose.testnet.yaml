services:
  privana:
    build:
      context: .
      args:
        - ENV_FILE=.env.testnet
    image: "ghcr.io/oasisprotocol/privana@sha256:acd6d4519eacca8c2720721b4df6873b33706c25693d0e9ab149ba019125a671"
    platform: linux/amd64
    environment:
      - SWEEP_STATE_DIR=/data/sweep-engine
      - SAPPHIRE_RPC_HEADERS
      - ONRAMP_PROVIDER
      - TRANSAK_CLIENT_IP_HEADER
      - TRANSAK_IP_ATTESTATION_SECRET
      - ALCHEMY_API_KEY
      - MOONPAY_API_KEY
      - MOONPAY_SECRET_KEY
      - MOONPAY_WEBHOOK_SECRET_KEY
      - TRANSAK_API_KEY
      - TRANSAK_API_SECRET
    volumes:
      - /run/rofl-appd.sock:/run/rofl-appd.sock
      - sweep-engine-data:/data/sweep-engine
    ports:
      - "8000:8000"
    annotations:
      net.oasis.proxy.ports.8000.custom_domain: api.testnet.privana.finance
    restart: on-failure

volumes:
  sweep-engine-data:
