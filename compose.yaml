services:
  accounting-module:
    build: .
    image: "docker.io/ahmedatoasis/accounting-module"
    platform: linux/amd64
    environment:
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - ACCOUNTING_CONTRACT_ADDRESS=${ACCOUNTING_CONTRACT_ADDRESS}
      - SAPPHIRE_CHAIN_ID=${SAPPHIRE_CHAIN_ID:-23295}
      - SAPPHIRE_RPC_URL=${SAPPHIRE_RPC_URL:-https://testnet.sapphire.oasis.io}
      - ACCOUNTING_GAS_LIMIT=${ACCOUNTING_GAS_LIMIT:-500000}
      - DEPOSIT_POLL_INTERVAL=${DEPOSIT_POLL_INTERVAL:-12}
    ports:
      - "8000:8000"
