services:
  privana:
    build:
      context: .
      args:
        - ENV_FILE=.env.mainnet
    image: "ghcr.io/oasisprotocol/privana@sha256:d6f0050e0288e60e93ec465cc92d4ebee6721d2147fb4ed589f6e37610025118"
    platform: linux/amd64
    environment:
      - SWEEP_STATE_DIR=/data/sweep-engine
      - ACCOUNTING_STATE_DIR=/data/accounting
      - SAPPHIRE_RPC_HEADERS
      - ONRAMP_PROVIDER
      - TRANSAK_CLIENT_IP_HEADER
      - TRANSAK_IP_ATTESTATION_SECRET
      - ALCHEMY_API_KEY
      - MOONPAY_API_KEY
      - MOONPAY_SECRET_KEY
      - MOONPAY_WEBHOOK_SECRET_KEY
      - TRANSAK_API_KEY
      - TRANSAK_API_SECRET
    volumes:
      - /run/rofl-appd.sock:/run/rofl-appd.sock
      - sweep-engine-data:/data/sweep-engine
      - accounting-data:/data/accounting
    ports:
      - "8000:8000"
    annotations:
      net.oasis.proxy.ports.8000.custom_domain: api.privana.finance
    restart: on-failure

volumes:
  sweep-engine-data:
  accounting-data:
