name = "privana-onramp-ip-attestation"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = false

# Same-origin route on the frontend zone: no CORS, no extra DNS, no extra cert.
# The path is claimed by the Worker only; the SPA never serves it.
# Before deployment, install and verify the required zone rate-limit rule in
# README.md. The gate must execute before this Worker is invoked.

[env.staging]
routes = [
  { pattern = "app.testnet.privana.finance/__onramp-ip-attest", zone_name = "privana.finance" },
]

[env.staging.vars]
REFERRER_DOMAIN = "app.testnet.privana.finance"

[env.production]
routes = [
  { pattern = "app.privana.finance/__onramp-ip-attest", zone_name = "privana.finance" },
]

[env.production.vars]
REFERRER_DOMAIN = "app.privana.finance"

# Secrets (never in this file), one independent value per environment:
#   wrangler secret put ATTESTATION_SECRET --env staging
#   wrangler secret put ATTESTATION_SECRET --env production
# The same value is provisioned to the matching backend deployment as
# TRANSAK_IP_ATTESTATION_SECRET via an encrypted ROFL secret. Minimum 32 characters.
