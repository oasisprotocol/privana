[project]
name = "privana-bench"
version = "0.0.0"
description = "Privana throughput benchmarks, run from an integrator's side"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "oasis-privana==0.4.0",
    "eth-account>=0.13.0",
    "eth-abi>=5.0.0",
    "eth-utils>=5.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "web3>=7.16.0",
    "oasis-sapphire-py>=0.4.2",
]

[project.scripts]
privana-bench = "privana_bench.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
    "mypy>=1.20.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/privana_bench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
ignore_missing_imports = true
